name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          for f in installer/*.sh scripts/*.sh packaging/deb/*.sh packaging/rpm/*.sh patches/*.sh; do
            bash -n "$f"
          done
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning installer/*.sh scripts/*.sh packaging/deb/*.sh packaging/rpm/*.sh patches/*.sh || true
      - name: Python syntax
        run: python3 -m py_compile patches/install-userscripts.py
      - name: Markdown links
        run: |
          test -f README.md && test -f LICENSE && test -f NOTICE
